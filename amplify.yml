version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm i -g pnpm@10
        - pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*
      - node_modules/**/*

